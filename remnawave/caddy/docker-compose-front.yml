x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  remnanode:
    image: remnawave/node:2.7.0
    container_name: remnanode
    hostname: remnanode
    network_mode: host
    cap_add:
      - NET_ADMIN
    <<: [*common, *logging, *env]
    volumes:
      - /opt/remnanode/geofiles/rnf_site.dat:/usr/local/share/xray/rnf_site.dat
      - /opt/remnanode/geofiles/rnf_ip.dat:/usr/local/share/xray/rnf_ip.dat
      - /var/log/remnanode:/var/log/remnanode:rw
      - /opt/remnanode/webserver/certs:/usr/local/share/xray/certs:ro
      - /dev/shm:/dev/shm:rw

  remnawave-caddy: # caddy image with level4 plugin built-in
    image: livekit/caddyl4:v2.10.2
    container_name: remnawave-caddy
    hostname: remnawave-caddy
    network_mode: host
    <<: [*common, *logging]
    volumes:
      - /opt/remnanode/webserver/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/remnanode/webserver/certs:/etc/caddy/ssl:ro
      - /opt/remnanode/webserver/website:/var/www/html:ro
      - /dev/shm:/dev/shm:rw
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /dev/shm/caddy* /dev/shm/xr* && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    depends_on:
      - remnanode

  warp-native:
    image: ghcr.io/xxphantom/docker-warp-native:1.3.0
    container_name: warp-native
    hostname: warp-native
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    <<: [*common, *logging]
   #environment:
     #- WARP_LICENSE=your-warp-plus-key  # Optional: WARP+ license key
    volumes:
      - /opt/remnanode/warp:/etc/wireguard
      - /lib/modules:/lib/modules:ro
