user nginx;
worker_processes auto;
worker_rlimit_nofile 1048576;
pid /var/run/nginx.pid;

events {
    worker_connections 1048576;
    multi_accept on;
    use epoll;
}

stream {
    map $ssl_preread_server_name $xray_backend {
        <NODE_DOMAIN2> unix:/dev/shm/xr-vtcr-s1.sock;

        google.com unix:/dev/shm/xr-vtcr-f1.sock;
        microsoft.com unix:/dev/shm/xr-vtcr-f2.sock;
        apple.com unix:/dev/shm/xr-vtcr-f3.sock;
        amazon.com unix:/dev/shm/xr-vtcr-f4.sock;
        samsung.com unix:/dev/shm/xr-vtcr-f5.sock;

        drive.google.com unix:/dev/shm/xr-vxhr-f1.sock;
        support.microsoft.com unix:/dev/shm/xr-vxhr-f2.sock;
        support.apple.com unix:/dev/shm/xr-vxhr-f3.sock;
        aws.amazon.com unix:/dev/shm/xr-vxhr-f4.sock;
        support.samsung.com unix:/dev/shm/xr-vxhr-f5.sock;

        cloud.google.com unix:/dev/shm/xr-vwsr-f1.sock;
        azure.microsoft.com unix:/dev/shm/xr-vwsr-f2.sock;
        developer.apple.com unix:/dev/shm/xr-vwsr-f3.sock;
        music.amazon.com unix:/dev/shm/xr-vwsr-f4.sock;
        account.samsung.com unix:/dev/shm/xr-vwsr-f5.sock;

        play.google.com unix:/dev/shm/xr-vgrr-f1.sock;
        account.microsoft.com unix:/dev/shm/xr-vgrr-f2.sock;
        music.apple.com unix:/dev/shm/xr-vgrr-f3.sock;
        developer.amazon.com unix:/dev/shm/xr-vgrr-f4.sock;
        developer.samsung.com unix:/dev/shm/xr-vgrr-f5.sock;

        default unix:/dev/shm/nginx.sock;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $xray_backend;
        proxy_protocol on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr notice;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    quic_gso on;
    ssl_early_data on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server { # Main website
        server_name <NODE_DOMAIN1>;

        listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
        http2 on;

        #listen 443 quic reuseport;
        #listen [::]:443 quic reuseport;
        #http3 on;

        #add_header Alt-Svc 'h3=":443"; ma=86400' always;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.key;

        set_real_ip_from unix:;
        real_ip_header proxy_protocol;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

        root /var/www/html;
        index index.html;

        location ~* (?:\.\./|\.(?:env|git|htaccess|ssh|asp|php|aspx|sql|bak|config|yaml|yml|ini|log)$|/(?:wp-admin|wp-login|phpmyadmin|admin|backup|config|db|setup|shell|api/v1/user/config)|/(?:uploads|temp|tmp|scripts|bin|etc|var|usr)/.*\.sh$) {
            return 444;
        }

        # xHTTP v1
        location ^~ /api/v1/network/XzTfN6LEnn7wWDJww {
            grpc_pass grpc://unix:/dev/shm/xr-vxht.sock;

            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 0;
            client_body_buffer_size 512k;
            client_body_timeout 24h;

            grpc_read_timeout 24h;
            grpc_send_timeout 24h;
        }

        # WebSocket v1
        location ^~ /api/v1/network/WPkUXTWEmMtrTtAm5 {
            proxy_pass http://unix:/dev/shm/xr-vwst.sock;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # gRPC v1
        location ^~ /apiRequestInteractionService/ {
            grpc_pass grpc://unix:/dev/shm/xr-vgrt.sock;

            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 0;
            client_body_buffer_size 512k;
            client_body_timeout 24h;

            grpc_read_timeout 24h;
            grpc_send_timeout 24h;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|mp4|webm)$ {
            add_header Cache-Control "public, max-age=2592000";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        }

        location /manifest.json {
            default_type application/manifest+json;
        }

        location / {
            try_files $uri $uri/ =444;
        }
    }

    server { # Steal website 1
        server_name <NODE_DOMAIN2>;

        listen unix:/dev/shm/nginx-steal1.sock ssl proxy_protocol;
        http2 on;

        #listen 443 quic;
        #listen [::]:443 quic;
        #http3 on;

        #add_header Alt-Svc 'h3=":443"; ma=86400' always;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.key;

        set_real_ip_from unix:;
        real_ip_header proxy_protocol;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

        root /var/www/html;
        index index.html;

        location ~* (?:\.\./|\.(?:env|git|htaccess|ssh|asp|php|aspx|sql|bak|config|yaml|yml|ini|log)$|/(?:wp-admin|wp-login|phpmyadmin|admin|backup|config|db|setup|shell|api/v1/user/config)|/(?:uploads|temp|tmp|scripts|bin|etc|var|usr)/.*\.sh$) {
            return 444;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|mp4|webm)$ {
            add_header Cache-Control "public, max-age=2592000";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        }

        location /manifest.json {
            default_type application/manifest+json;
        }

        location / {
            try_files $uri $uri/ =444;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name <NODE_DOMAIN1> <NODE_DOMAIN2>;

        location ~* (?:\.\./|\.(?:env|git|htaccess|ssh|asp|php|aspx|sql|bak|config|yaml|yml|ini|log)$|/(?:wp-admin|wp-login|phpmyadmin|admin|backup|config|db|setup|shell|api/v1/user/config)|/(?:uploads|temp|tmp|scripts|bin|etc|var|usr)/.*\.sh$) {
            return 444;
        }

        return 301 https://$host$request_uri;
    }
}
