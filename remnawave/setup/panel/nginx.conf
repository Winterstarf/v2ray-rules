user  nginx;
worker_processes  auto;

pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log  /dev/stderr notice;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    server_names_hash_bucket_size 128;

    upstream remnawave {
        server remnawave:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $http_cookie $auth_cookie {
        default 0;
        "~*<COOKIE_NAME>=<COOKIE_VALUE>" 1;
    }

    map $arg_<COOKIE_NAME> $auth_query {
        default 0;
        "<COOKIE_VALUE>" 1;
    }

    map $remote_addr $auth_ip {
        default 0;
        "<SUBPAGE_IP>" 1;
    }

    map "$auth_cookie$auth_query$auth_ip" $authorized {
        "~1"    1;
        default 0;
    }

    map $arg_<COOKIE_NAME> $set_cookie_header {
        "<COOKIE_VALUE>" "<COOKIE_NAME>=<COOKIE_VALUE>; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=31536000";
        default "";
    }

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        server_name <PANEL_DOMAIN>;

        listen 443 ssl reuseport;
        listen [::]:443 ssl reuseport;
        http2 on;

        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;
        add_header Alt-Svc 'h3=":443"; ma=86400';

        ssl_certificate "/etc/nginx/ssl/fullchain.pem";
        ssl_certificate_key "/etc/nginx/ssl/privkey.key";
        ssl_trusted_certificate "/etc/nginx/ssl/fullchain.pem";

        resolver 127.0.0.11 1.1.1.1 8.8.8.8 9.9.9.9 valid=60s;
        resolver_timeout 2s;

        location / {
            error_page 418 = @unauthorized;
            recursive_error_pages on;

            if ($authorized = 0) {
                return 418;
            }

            add_header Set-Cookie $set_cookie_header always;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

            proxy_http_version 1.1;
            proxy_pass http://remnawave;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location @unauthorized {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        ssl_reject_handshake on;

        return 444;
    }
}
