    server {
        server_name <MINIAPP_DOMAIN>;

        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate "/etc/nginx/ssl/fullchain.pem";
        ssl_certificate_key "/etc/nginx/ssl/privkey.key";

        client_max_body_size 32m;

        location /miniapp/ {
            proxy_pass http://remnawave_bot_unified;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /app-config.json {
            add_header Access-Control-Allow-Origin "*";
            proxy_pass http://remnawave_bot_unified;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /var/www/remnawave-miniapp;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        ssl_reject_handshake on;

        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name <SUBPAGE_DOMAIN>;

        location ~* (?:\.\./|\.(?:env|git|htaccess|ssh|asp|php|aspx|sql|bak|config|yaml|yml|ini|log)$|/(?:wp-admin|wp-login|phpmyadmin|admin|backup|config|db|setup|shell|api/v1/user/config)|/(?:uploads|temp|tmp|scripts|bin|etc|var|usr)/.*\.sh$) {
            return 444;
        }

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name <WEBHOOKS_DOMAIN> <MINIAPP_DOMAIN>;

        return 301 https://$host$request_uri;
    }
}
