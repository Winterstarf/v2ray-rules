user  nginx;
worker_processes  auto;

pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log  /dev/stderr notice;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    server_names_hash_bucket_size 128;

    # Subpage
    upstream remnawave {
        server remnawave-subscription-page:3010;
    }

    # Bot
    upstream remnawave_bot_unified {
	server remnawave-bot:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        server_name <SUBPAGE_DOMAIN>;

        listen 443 ssl reuseport;
        listen [::]:443 ssl reuseport;
        http2 on;

        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;
        add_header Alt-Svc 'h3=":443"; ma=86400';

        ssl_certificate "/etc/nginx/ssl/fullchain.pem";
        ssl_certificate_key "/etc/nginx/ssl/privkey.key";
        ssl_trusted_certificate "/etc/nginx/ssl/fullchain.pem";

        resolver 127.0.0.11 1.1.1.1 8.8.8.8 9.9.9.9 valid=60s;
        resolver_timeout 2s;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

        location ~* (?:\.\./|\.(?:env|git|htaccess|ssh|asp|php|aspx|sql|bak|config|yaml|yml|ini|log)$|/(?:wp-admin|wp-login|phpmyadmin|admin|backup|config|db|setup|shell|api/v1/user/config)|/(?:uploads|temp|tmp|scripts|bin|etc|var|usr)/.*\.sh$) {
            return 444;
        }

        location /<FILEDUMP_LOC>/ {
            alias /var/www/filedump/;
            autoindex off;
        }

        location / {
            proxy_http_version 1.1;
            proxy_pass http://remnawave;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;

            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

	    proxy_intercept_errors on;
            error_page 403 404 502 @redirect;
        }

        location = / {
            return 301 https://<ROOT_DOMAIN>;
        }

        location @redirect {
            return 301 https://<ROOT_DOMAIN>;
        }
    }

    server {
        server_name <WEBHOOKS_DOMAIN>;

        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        ssl_certificate "/etc/nginx/ssl/fullchain.pem";
        ssl_certificate_key "/etc/nginx/ssl/privkey.key";

        client_max_body_size 32m;

        # Webhook пути для платежных систем
